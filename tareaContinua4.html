<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea Continua 4</title>

</head>
    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 20px;
            background: linear-gradient(to right, yellow, black);
        }
    </style>
<body>
    
    <script>
        /*
            4.- Modifica el programa para que el usuario pueda elegir lo que quiere hacer con la
                lista. Las opciones serán:
                • Mostrar el primer contacto (primero)
                • Mostrar el último contacto (último)
                • Añadir un nuevo contacto (nuevo)

                Al agregar un nuevo contacto, verifica si el usuario ha ingresado todos los datos
                necesarios. Si falta al menos uno de los tres valores (nombre, teléfono o correo
                electrónico), no se agrega el contacto.
        */

        let listaContactos = [
            { nombre: "Maxwell Wright", telefono: "(0191) 719 6495", correo: "Curabitur.egestas.nunc@nonummyac.com" },
            { nombre: "Raja Villareal", telefono: "0866 398 2895", correo: "posuere.vulputate@sed.com" },
            { nombre: "Helen Richards", telefono: "0800 1111", correo: "libero@convallis.edu" }
        ];

        let opcion = prompt("¿Qué quieres hacer con la lista de contactos?\n\n1.- Mostrar el primer contacto\n2.- Mostrar el último contacto\n3.- Añadir un nuevo contacto");

        switch (opcion) {
            case "1":
                alert("Primer contacto:\n" + "Nombre: " + listaContactos[0].nombre + " / " + "\nTeléfono: " + listaContactos[0].telefono + " / " + "\nCorreo: " + listaContactos[0].correo);
                document.write("Primer contacto:<br>" + listaContactos[0].nombre + "<br>" + listaContactos[0].telefono + "<br>" + listaContactos[0].correo + "<br><br>");
                break;

            case "2":
                alert("Último contacto:\n" + "Nombre: " + listaContactos[listaContactos.length - 1].nombre + " / " + "\nTeléfono: " + listaContactos[listaContactos.length - 1].telefono + " / " + "\nCorreo: " + listaContactos[listaContactos.length - 1].correo);
                document.write("Último contacto:<br>" + listaContactos[listaContactos.length - 1].nombre + "<br>" + listaContactos[listaContactos.length - 1].telefono + "<br>" + listaContactos[listaContactos.length - 1].correo);
                break;

            case "3":
                let nuevoContacto = {
                    nombre: prompt("Introduce el nombre del nuevo contacto:"),
                    telefono: prompt("Introduce el teléfono del nuevo contacto:"),
                    correo: prompt("Introduce el correo del nuevo contacto:")
                };

                if (nuevoContacto.nombre && nuevoContacto.telefono && nuevoContacto.correo) {
                    listaContactos.push(nuevoContacto);
                    alert("Contacto añadido correctamente.");
                } else {
                    alert("No se ha podido añadir el contacto. Debes introducir todos los datos.");
                }
                break;
            default:
                alert("Opción no válida.");
                break;
        }
    </script>

</body>

</html>
