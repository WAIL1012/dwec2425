<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 20px;
            background: linear-gradient(to right, yellow, black);
        }
    </style>

    <body>

        <script>
    /* 
        3.- Modifica el programa para agregar, al final de la lista, el contacto que el usuario
            introducirá durante la ejecución del programa. (prompt). Al final, muestra el primer y
            último contacto de la lista.
    */

    let listaContactos = [
            { nombre: "Maxwell Wright", telefono: "(0191) 719 6495", correo: "Curabitur.egestas.nunc@nonummyac.com" },
            { nombre: "Raja Villareal", telefono: "0866 398 2895", correo: "posuere.vulputate@sed.com" },
            { nombre: "Helen Richards", telefono: "0800 1111", correo: "libero@convallis.edu" }
    ];

    let nuevoContacto = {
        nombre: prompt("Introduce el nombre del nuevo contacto:"),
        telefono: prompt("Introduce el teléfono del nuevo contacto:"),
        correo: prompt("Introduce el correo del nuevo contacto:")
    };

    listaContactos.push(nuevoContacto);
    let limite = listaContactos.length;

    alert("Primer contacto:\n" + "Nombre: " + listaContactos[0].nombre + " / " + "\nTeléfono: " + listaContactos[0].telefono + " / " + "\nCorreo: " + listaContactos[0].correo);
    document.write("Primer contacto:<br>" + listaContactos[0].nombre + "<br>" + listaContactos[0].telefono + "<br>" + listaContactos[0].correo + "<br><br>");

    alert("Último contacto:\n" + "Nombre: " + listaContactos[limite - 1].nombre + " / " + "\nTeléfono: " + listaContactos[limite - 1].telefono + " / " + "\nCorreo: " + listaContactos[limite - 1].correo);
    document.write("Último contacto:<br>" + listaContactos[limite - 1].nombre + "<br>" + listaContactos[limite - 1].telefono + "<br>" + listaContactos[limite - 1].correo);

    </script>

    </body>

</html>
