<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea Continua 6</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 20px;
            background: linear-gradient(to right, yellow, black);
        }
    </style>
</head>

<body>

    <br id="espacio">

    <script>
        /* 
            6.- Trata de organizar el código de tu programa (¿quitando switch?) usando funciones.
            Define y llama a tres funciones en los lugares apropiados:

            • showContact: la función debe tomar dos argumentos; el primero es la lista de
                contactos y el segundo es el número de índice del contacto a mostrar; dentro de
                la función, verifica si se pasan los argumentos correctos, es decir, si los contactos
                son un array (utiliza la construcción instanceofArray para esto).

            • showAllContacts: la función debe tomar un argumento, la lista de contactos;
                dentro de la función, verifica si el argumento dado es un array.

            • addNewContact: la función debe tomar cuatro argumentos, una lista de
                contactos y los datos del nuevo contacto, es decir: nombre, teléfono y número;
                antes de agregar un nuevo contacto, verifica si el argumento pasado es un array
                y si los datos del nuevo contacto tienen algún valor.
        */
        let listaContactos = [
            { nombre: "Maxwell Wright", telefono: "(0191) 719 6495", correo: "Curabitur.egestas.nunc@nonummyac.com" },
            { nombre: "Raja Villareal", telefono: "0866 398 2895", correo: "posuere.vulputate@sed.com" },
            { nombre: "Helen Richards", telefono: "0800 1111", correo: "libero@convallis.edu" }
        ];

        function showContact(contactos, indice) {

            let limiteContactos = contactos.length;
            if (contactos instanceof Array && indice >= 0 && indice < limiteContactos) {
                alert("Contacto:\n" + "Nombre: " + contactos[indice].nombre + " / " + "\nTeléfono: " + contactos[indice].telefono + " / " + "\nCorreo: " + contactos[indice].correo);
                document.write("Contacto:<br>" + contactos[indice].nombre + "<br>" + contactos[indice].telefono + "<br>" + contactos[indice].correo + "<br><br>");
            } else {
                alert("No se ha encontrado el contacto.");
            }
        }

        function showAllContacts(contactos) {
            let limiteContactos = contactos.length;
            if (contactos instanceof Array) {
                for (let i = 0; i < limiteContactos; i++) {
                    alert("Contacto:\n" + "Nombre: " + contactos[i].nombre + " / " + "\nTeléfono: " + contactos[i].telefono + " / " + "\nCorreo: " + contactos[i].correo);
                    document.write("Contacto:<br>" + contactos[i].nombre + "<br>" + contactos[i].telefono + "<br>" + contactos[i].correo + "<br><br>");
                }
            } else {
                alert("No se han encontrado contactos.");
            }
        }

        function addNewContact(contactos, nombre, telefono, correo) {
            if (contactos instanceof Array && nombre && telefono && correo) {
                let nuevoContacto = {
                    nombre: nombre,
                    telefono: telefono,
                    correo: correo
                };
                contactos.push(nuevoContacto);
                alert("Contacto añadido correctamente.");
            } else {
                alert("No se ha podido añadir el contacto. Debes introducir todos los datos.");
            }
        }

        

        document.write("Contacto con el índice 1", document.getElementById("espacio").innerHTML = "<br>");
        showContact(listaContactos, 1);

        document.write("Mostrar todos los contactos", document.getElementById("espacio").innerHTML = "<br>");
        showAllContacts(listaContactos);

        document.write("Contacto añadido (John Doe, 1234 567 890, john.doe@example.com)", document.getElementById("espacio").innerHTML = "<br>");
        addNewContact(listaContactos, "John Doe", "1234 567 890", "john.doe@example.com");

        document.write("Mostrar todos los contactos más el añadido", document.getElementById("espacio").innerHTML = "<br>");
        showAllContacts(listaContactos);
        
    </script>
</body>

</html>
